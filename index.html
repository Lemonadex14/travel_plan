<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動式旅遊行程規劃器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 隱藏滾動條但保留功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 懸停間隙時顯示的插入按鈕與線條 */
    .insert-row-divider {
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      height: 12px;
      margin-top: -6px;
      margin-bottom: -6px;
      position: relative;
      z-index: 10;
    }
    .insert-row-divider:hover {
      opacity: 1;
    }

    .insert-col-divider {
      opacity: 0;
      transition: opacity 0.2s ease;
      width: 14px;
      margin-left: -7px;
      margin-right: -7px;
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
    }
    .insert-col-divider:hover {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 pb-20">

  <!-- 頂部列 Header -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- 行程名稱編輯欄與全行程總金額 -->
      <div class="flex items-center gap-3 flex-1 min-w-[280px]">
        <i class="fa-solid fa-map-location-dot text-indigo-600 text-xl shrink-0"></i>
        <input 
          id="tripTitleInput" 
          type="text" 
          placeholder="輸入行程名稱..." 
          class="w-full text-xl font-bold text-slate-800 border-b-2 border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none bg-transparent px-1 py-0.5 transition" 
          value="東京五天四夜自由行"
          onchange="updateTripTitle(this.value)"
        />
        <!-- 全行程總預算統計 -->
        <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-xl shrink-0 text-xs font-bold shadow-sm" title="所有天數行程輸入的費用總計">
          <i class="fa-solid fa-coins text-emerald-500"></i>
          <span>行程總預算:</span>
          <span id="grandTotalDisplay" class="text-emerald-800 text-sm font-extrabold">0</span>
          <span id="grandTotalCurrencyUnit" class="text-[11px] text-emerald-600 font-semibold">TWD</span>
          <span id="grandTotalTwdDisplay" class="text-[11px] text-emerald-600 font-normal ml-0.5 hidden">(≈ NT$ 0)</span>
        </div>
      </div>

      <!-- 右側按鈕區 & 幣別選擇 -->
      <div class="flex items-center gap-2">
        <!-- 幣別切換與匯率 -->
        <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
          <i class="fa-solid fa-globe text-slate-500 ml-1"></i>
          <select id="currencySelect" onchange="changeCurrency(this.value)" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold text-slate-700 focus:outline-none cursor-pointer">
            <option value="TWD">TWD (NT$)</option>
            <option value="JPY">JPY (日圓)</option>
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="KRW">KRW (₩)</option>
            <option value="CNY">CNY (元)</option>
          </select>
          <div id="exchangeRateContainer" class="flex items-center gap-1 hidden">
            <span class="text-slate-400 font-medium">1 JPY =</span>
            <input type="number" id="exchangeRateInput" step="0.0001" value="0.21" onchange="updateExchangeRate(this.value)" class="w-16 px-1.5 py-0.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold text-slate-700 focus:outline-none" title="換算回台幣 (TWD) 的匯率">
            <span class="text-slate-500">TWD</span>
          </div>
        </div>

        <button 
          onclick="exportStandaloneHTML()" 
          class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl shadow-sm hover:shadow transition text-sm cursor-pointer"
          title="將整份行程導出為可離線開啟的單一 HTML 檔案"
        >
          <i class="fa-solid fa-file-export"></i>
          <span>匯出網頁檔</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-5xl mx-auto px-4 pt-6">

    <!-- 天數切換頁籤欄 (Day Nav Bar) -->
    <section class="mb-4">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-2" id="dayTabsContainer">
        <!-- 動態產生 Day 橢圓標籤 -->
      </div>
    </section>

    <!-- 當前天數與日期顯示區 -->
    <section class="mb-4 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span id="currentDayTitle" class="font-bold text-slate-800 text-lg">第一天</span>
        <span id="currentDayDateDisplay" class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full font-medium border border-indigo-100">未設定日期</span>
        
        <!-- 當日費用總計 -->
        <div class="flex items-center gap-1.5 bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1 rounded-xl text-xs font-bold shadow-sm" title="當天各項目費用總和">
          <i class="fa-solid fa-calculator text-amber-500"></i>
          <span>當日總計:</span>
          <span id="dayTotalDisplay" class="text-amber-900 font-extrabold text-sm">0</span>
          <span id="dayTotalCurrencyUnit" class="text-[11px] text-amber-700 font-semibold">TWD</span>
          <span id="dayTotalTwdDisplay" class="text-[11px] text-amber-700 font-normal ml-0.5 hidden">(≈ NT$ 0)</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <label for="dayDatePicker" class="text-xs font-semibold text-slate-500 flex items-center gap-1">
          <i class="fa-regular fa-calendar-days text-indigo-500"></i> 設定當天日期：
        </label>
        <input 
          type="date" 
          id="dayDatePicker" 
          onchange="updateCurrentDayDate(this.value)"
          class="px-2.5 py-1 text-xs border border-slate-300 rounded-xl bg-white text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none cursor-pointer"
        >
      </div>
    </section>

    <!-- 當前天數行程內容區 -->
    <section class="space-y-4" id="itineraryRowsContainer">
      <!-- 動態產生行程列 (Row) -->
    </section>

    <!-- 底部新增一整列行程的虛線按鈕 (+ 號) -->
    <section class="mt-6">
      <button 
        onclick="addNewRow()" 
        class="w-full py-4 border-2 border-dashed border-slate-300 hover:border-indigo-400 hover:bg-indigo-50/50 rounded-2xl flex items-center justify-center text-slate-400 hover:text-indigo-600 transition group cursor-pointer"
        title="新增下一筆行程列"
      >
        <div class="w-9 h-9 rounded-full bg-slate-200 group-hover:bg-indigo-100 flex items-center justify-center transition">
          <i class="fa-solid fa-plus text-slate-500 group-hover:text-indigo-600"></i>
        </div>
      </button>
    </section>
  </main>

  <!-- 項目編輯彈出視窗 Modal -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden my-8 max-h-[90vh] flex flex-col transform transition-all border border-slate-200">
      
      <!-- Modal 標題區 -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-500"></i> 編輯行程項目
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-200/50 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Modal 表單內文 (可滾動) -->
      <div class="p-6 space-y-4 overflow-y-auto flex-1 text-sm text-slate-700">

        <!-- 1. 項目標題 & 顏色選取 -->
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
          <div class="sm:col-span-3">
            <label class="block text-xs font-semibold text-slate-500 mb-1">項目名稱 / 簡述</label>
            <input type="text" id="modalTitle" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例：搭乘 航班 TPE - NRT">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">標籤顏色</label>
            <div class="flex items-center gap-2">
              <input type="color" id="modalColor" class="w-10 h-9 rounded-xl border border-slate-300 p-0.5 cursor-pointer bg-white">
              <span class="text-xs text-slate-400">顏色</span>
            </div>
          </div>
        </div>

        <!-- 2. 主分類選取 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">類別</label>
          <div class="grid grid-cols-6 gap-1.5">
            <button type="button" onclick="selectCategory('transport', true)" id="catBtn-transport" class="cat-btn border border-slate-200 rounded-xl py-2 flex flex-col items-center gap-1 transition text-slate-600 hover:bg-slate-50">
              <i class="fa-solid fa-plane text-base"></i>
              <span class="text-xs">交通</span>
            </button>
            <button type="button" onclick="selectCategory('hotel', true)" id="catBtn-hotel" class="cat-btn border border-slate-200 rounded-xl py-2 flex flex-col items-center gap-1 transition text-slate-600 hover:bg-slate-50">
              <i class="fa-solid fa-bed text-base"></i>
              <span class="text-xs">住宿</span>
            </button>
            <button type="button" onclick="selectCategory('sightseeing', true)" id="catBtn-sightseeing" class="cat-btn border border-slate-200 rounded-xl py-2 flex flex-col items-center gap-1 transition text-slate-600 hover:bg-slate-50">
              <i class="fa-solid fa-camera-retro text-base"></i>
              <span class="text-xs">景點</span>
            </button>
            <button type="button" onclick="selectCategory('dining', true)" id="catBtn-dining" class="cat-btn border border-slate-200 rounded-xl py-2 flex flex-col items-center gap-1 transition text-slate-600 hover:bg-slate-50">
              <i class="fa-solid fa-utensils text-base"></i>
              <span class="text-xs">用餐</span>
            </button>
            <button type="button" onclick="selectCategory('shopping', true)" id="catBtn-shopping" class="cat-btn border border-slate-200 rounded-xl py-2 flex flex-col items-center gap-1 transition text-slate-600 hover:bg-slate-50">
              <i class="fa-solid fa-bag-shopping text-base"></i>
              <span class="text-xs">購買</span>
            </button>
            <button type="button" onclick="selectCategory('other', true)" id="catBtn-other" class="cat-btn border border-slate-200 rounded-xl py-2 flex flex-col items-center gap-1 transition text-slate-600 hover:bg-slate-50">
              <i class="fa-solid fa-ellipsis text-base"></i>
              <span class="text-xs">自訂</span>
            </button>
          </div>
        </div>

        <!-- 3. 動態分類欄位 (根據 chosen Category 顯示) -->

        <!-- A. 交通欄位 -->
        <div id="fields-transport" class="cat-fields space-y-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">交通工具類型</label>
            <select id="modalTransportType" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="plane">✈️ 飛機</option>
              <option value="bus">🚌 公車 / 巴士</option>
              <option value="car">🚗 汽車 / 開車</option>
              <option value="scooter">🛵 機車</option>
              <option value="taxi">🚕 計程車</option>
              <option value="walk">🚶 走路</option>
              <option value="bike">🚴 騎腳踏車</option>
              <option value="train">列車 / 電車</option>
            </select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">預估時間 (幾點到幾點)</label>
              <input type="text" id="modalTransportTime" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 08:30 - 11:45">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">總花費時間</label>
              <input type="text" id="modalTransportDuration" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 3.5 小時">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">班次 / 細節資訊</label>
            <textarea id="modalTransportDetails" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="輸入班次、時間或路線號碼..."></textarea>
          </div>
        </div>

        <!-- B. 住宿欄位 -->
        <div id="fields-hotel" class="cat-fields space-y-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">飯店 / 住宿名稱</label>
            <input type="text" id="modalHotelName" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="輸入飯店名稱">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">住宿總價格</label>
              <input type="text" id="modalHotelTotalPrice" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: NT$ 12,000">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">訂房管道 / 方式</label>
              <input type="text" id="modalHotelBookingMethod" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: Agoda / Booking">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">已付訂金金額</label>
              <input type="text" id="modalHotelDeposit" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 已付全額 / 3,000">
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">官方網址 / 訂房連結</label>
              <input type="url" id="modalHotelUrl" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="https://...">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">住址</label>
              <input type="text" id="modalHotelAddress" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="地址">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">如何前往 / 交通指引</label>
            <input type="text" id="modalHotelAccess" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="從地鐵 3 號出口步行 5 分鐘">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">住宿備註</label>
            <input type="text" id="modalHotelNotes" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="如: 入住時間 15:00 後、可寄放行李">
          </div>
          <!-- 勾選標籤選項 -->
          <div class="flex flex-wrap gap-4 pt-1">
            <label class="flex items-center gap-1.5 cursor-pointer text-xs font-medium text-slate-700">
              <input type="checkbox" id="modalHotelBreakfast" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500"> 附早餐
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer text-xs font-medium text-slate-700">
              <input type="checkbox" id="modalHotelParking" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500"> 提供停車場
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer text-xs font-medium text-slate-700">
              <input type="checkbox" id="modalHotelPaid" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500"> 訂金已付清
            </label>
          </div>
        </div>

        <!-- C. 景點欄位 -->
        <div id="fields-sightseeing" class="cat-fields space-y-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">必去亮點 / 必玩項目</label>
            <input type="text" id="modalSpotHighlight" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 晴空塔展望台看夜景、秋葉原動漫街探店">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">門票費用 (TWD/JPY...)</label>
              <input type="text" id="modalSpotPrice" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 2,000 日圓 / 免費">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">優先級別 / 推薦星等</label>
              <div class="flex items-center gap-1 py-1" id="spotStarRatingContainer">
                <!-- 動態星等按鈕 -->
              </div>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">參考網址 / 攻略</label>
            <input type="url" id="modalSpotUrl" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="https://...">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">景點備註</label>
            <textarea id="modalSpotNotes" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 營業時間 09:00 - 21:00、可提前線上預約門票..."></textarea>
          </div>
        </div>

        <!-- D. 用餐欄位 -->
        <div id="fields-dining" class="cat-fields space-y-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">推薦菜單 / 必吃美食</label>
            <input type="text" id="modalDiningMenu" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 招牌海膽丼、特濃豚骨拉麵">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">預估價格 / 預算</label>
              <input type="text" id="modalDiningPrice" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 3,000 日圓/人">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">優先級別 / 推薦星等</label>
              <div class="flex items-center gap-1 py-1" id="diningStarRatingContainer">
                <!-- 動態星等按鈕 -->
              </div>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">餐廳網址 / 地圖連結</label>
            <input type="url" id="modalDiningUrl" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="https://tabelog.com/...">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">用餐備註</label>

  <!-- 邏輯與資料流 JS -->
  <script>
    // 各類別預設顏色表 (Default Color Map)
    const categoryDefaultColors = {

      hotel: '#dcfce7',      // 淺綠色
      dining: '#f3e8ff',     // 淺粉紫色
      sightseeing: '#fef9c3', // 淺黃色
      shopping: '#ffedd5',   // 淺橘色
      other: '#ffffff'       // 白色

    // 各幣別預設對 TWD 匯率 (Exchange rates base: TWD)

      TWD: 1,

      USD: 32.0,   // 1 美元 ≈ 32 新台幣
      EUR: 34.5,   // 1 歐元 ≈ 34.5 新台幣
      KRW: 0.023,  // 1 韓元 ≈ 0.023 新台幣
      CNY: 4.45    // 1 人民幣 ≈ 4.45 新台幣
    };

    // 主要應用程式資料架構 (Data Model)
    let tripData = {
      title: "東京自由行熱門規劃",
      currency: "TWD",
      customRate: 0.21, // 針對主要外幣 (如 JPY) 對 TWD 的自訂匯率
      activeDayIndex: 0,
      days: [
        {
          name: "第一天",
          date: "",
          rows: [
            [
              { id: '1', title: '成田機場 - NRT 抵達', color: '#e0f2fe', category: 'transport', transportType: 'plane', transportTime: '08:30 - 12:45', transportDuration: '3小時15分', transportDetails: '航班 BR198 12:45 抵達' }
            ],
            [
              { id: '2', title: '搭乘 Skyliner 到上野', color: '#e0f2fe', category: 'transport', transportType: 'train', transportTime: '13:30 - 14:15', transportDuration: '45分鐘', transportDetails: '車程約 41 分鐘' }
            ],
            [
              { id: '3', title: '飯店 Check-in', color: '#dcfce7', category: 'hotel', hotelName: '上野 Candeo Hotel', hotelTotalPrice: 'NT$ 16,000', hotelBookingMethod: 'Agoda', hotelDeposit: '已付全額', hotelPaid: true, hotelBreakfast: true }
            ],
            [
              { id: '4', title: '阿美橫丁吃拉麵', color: '#f3e8ff', category: 'dining', diningMenu: '特濃鴨湯拉麵', diningPrice: '1,200日圓', rating: 5 },
              { id: '5', title: '備選: 燒肉特餐', color: '#f3e8ff', category: 'dining', diningMenu: 'A5 和牛盛合', diningPrice: '3,500日圓', rating: 4 }
            ]
          ]
        },
        {
          name: "第二天",
          date: "",
          rows: [
            [
              { id: '6', title: '東京晴空塔觀景', color: '#fef9c3', category: 'sightseeing', spotHighlight: '晴空塔 450F 天望回廊夜景', spotPrice: '2,700日圓', rating: 5 }
            ]
          ]
        }
      ]
    };

    // 當前正被編輯的 Item 記憶指標
    let editingContext = {
      dayIndex: null,
      rowIndex: null,
      itemIndex: null,
      tempImageBase64: null,
      selectedCategory: 'transport',
      currentRating: 0
    };

    // 初始化讀取 LocalStorage 或使用預設
    window.onload = function() {
      const saved = localStorage.getItem('interactive_itinerary_data');
      if (saved) {
        try {
          tripData = JSON.parse(saved);
        } catch(e) {
          console.error("無法載入暫存資料", e);
        }
      }
      document.getElementById('tripTitleInput').value = tripData.title || "行程名稱";
      if (!tripData.currency) tripData.currency = 'TWD';
      if (!tripData.customRate) tripData.customRate = defaultExchangeRates[tripData.currency] || 1;

      document.getElementById('currencySelect').value = tripData.currency;
      updateCurrencyRateUI();

      renderApp();
    };

    // 切換全域幣別
    function changeCurrency(newCurrency) {
      tripData.currency = newCurrency;
      if (defaultExchangeRates[newCurrency] !== undefined) {
        tripData.customRate = defaultExchangeRates[newCurrency];
      }
      updateCurrencyRateUI();
      renderApp();
    }

    // 更新自訂匯率
    function updateExchangeRate(val) {
      const rate = parseFloat(val);
      if (!isNaN(rate) && rate > 0) {
        tripData.customRate = rate;
        renderApp();
      }
    }

    // 更新匯率輸入介面顯示狀態
    function updateCurrencyRateUI() {
      const container = document.getElementById('exchangeRateContainer');
      const rateInput = document.getElementById('exchangeRateInput');
      const cur = tripData.currency || 'TWD';

      if (cur === 'TWD') {
        container.classList.add('hidden');
      } else {
        container.classList.remove('hidden');
        container.querySelector('span').innerText = `1 ${cur} =`;
        rateInput.value = tripData.customRate || defaultExchangeRates[cur] || 1;
      }

      document.getElementById('grandTotalCurrencyUnit').innerText = cur;
      document.getElementById('dayTotalCurrencyUnit').innerText = cur;
    }

    // 儲存資料到 LocalStorage
    function saveData() {
      localStorage.setItem('interactive_itinerary_data', JSON.stringify(tripData));
    }

    // 更新行程名稱
    function updateTripTitle(val) {
      tripData.title = val;
      saveData();
    }

    // 更新當前天數的日期
    function updateCurrentDayDate(dateVal) {
      const currentDay = tripData.days[tripData.activeDayIndex];
      if (currentDay) {
        currentDay.date = dateVal;
        renderHeaderDateInfo();
        saveData();
      }
    }

    // 主渲染流程
    function renderApp() {
      renderDayTabs();
      renderHeaderDateInfo();
      renderItineraryRows();
      calculateTotals();
      saveData();
    }

    // 計算當日總金額與全行程總金額（統一換算為當前選定幣別）
    function calculateTotals() {
      let grandTotalInTargetCurrency = 0;
      let currentDayTotalInTargetCurrency = 0;
      let grandTotalInTWD = 0;
      let currentDayTotalInTWD = 0;

      const targetCurrency = tripData.currency || 'TWD';

      tripData.days.forEach((day, dIdx) => {
        let dayTotalInTarget = 0;
        let dayTotalInTWD = 0;

        if (day.rows) {
          day.rows.forEach(row => {
            row.forEach(item => {
              const amounts = getItemAmounts(item, targetCurrency);

              dayTotalInTarget += amounts.targetAmount;
              dayTotalInTWD += amounts.twdAmount;
            });
          });
        }

        if (dIdx === tripData.activeDayIndex) {
          currentDayTotalInTargetCurrency = dayTotalInTarget;
          currentDayTotalInTWD = dayTotalInTWD;
        }

        grandTotalInTargetCurrency += dayTotalInTarget;
        grandTotalInTWD += dayTotalInTWD;
      });

      // 格式化顯示 (加上千分位號)
      document.getElementById('dayTotalDisplay').innerText = currentDayTotalInTargetCurrency > 0 ? Math.round(currentDayTotalInTargetCurrency).toLocaleString() : '0';
      document.getElementById('grandTotalDisplay').innerText = grandTotalInTargetCurrency > 0 ? Math.round(grandTotalInTargetCurrency).toLocaleString() : '0';

      // 換算台幣 (NT$) 顯示控制
      const dayTwdEl = document.getElementById('dayTotalTwdDisplay');
      const grandTwdEl = document.getElementById('grandTotalTwdDisplay');

      if (targetCurrency !== 'TWD') {
        dayTwdEl.innerText = `(≈ NT$ ${Math.round(currentDayTotalInTWD).toLocaleString()})`;
        grandTwdEl.innerText = `(≈ NT$ ${Math.round(grandTotalInTWD).toLocaleString()})`;
        dayTwdEl.classList.remove('hidden');
        grandTwdEl.classList.remove('hidden');
      } else {
        dayTwdEl.classList.add('hidden');
        grandTwdEl.classList.add('hidden');
      }
    }

    // 解析文字中的金額與原生幣別，並精確計算目標幣別與對應台幣金額
    function getItemAmounts(item, targetCurrency) {
      let rawStr = '';

      if (item.category === 'hotel') {
        rawStr = item.hotelTotalPrice || '';
      } else if (item.category === 'sightseeing') {
        rawStr = item.spotPrice || '';
      } else if (item.category === 'dining') {
        rawStr = item.diningPrice || '';
      } else if (item.category === 'shopping') {
        rawStr = item.shoppingAmount || '';
      }

      if (!rawStr) return { targetAmount: 0, twdAmount: 0 };

      // 1. 提取純數字
      const match = rawStr.replace(/,/g, '').match(/(\d+(\.\d+)?)/);
      if (!match) return { targetAmount: 0, twdAmount: 0 };
      const numValue = parseFloat(match[0]);

      // 2. 自動判斷原始輸入字串的幣別
      let detectedCurrency = targetCurrency;
      const upperStr = rawStr.toUpperCase();

      if (upperStr.includes('日圓') || upperStr.includes('日幣') || upperStr.includes('JPY') || upperStr.includes('円') || upperStr.includes('¥')) {
        detectedCurrency = 'JPY';
      } else if (upperStr.includes('NT') || upperStr.includes('TWD') || upperStr.includes('台幣')) {
        detectedCurrency = 'TWD';
      } else if (upperStr.includes('USD') || upperStr.includes('$')) {
        detectedCurrency = 'USD';
      } else if (upperStr.includes('EUR') || upperStr.includes('€')) {
        detectedCurrency = 'EUR';
      } else if (upperStr.includes('KRW') || upperStr.includes('₩') || upperStr.includes('韓元')) {
        detectedCurrency = 'KRW';
      } else if (upperStr.includes('CNY') || upperStr.includes('RMB') || upperStr.includes('人民幣')) {
        detectedCurrency = 'CNY';
      }

      // 3. 換算成台幣 (TWD) 金額
      let twdAmount = numValue;
      if (detectedCurrency === 'JPY') {
        twdAmount = numValue * (tripData.customRate || defaultExchangeRates.JPY);
      } else if (detectedCurrency !== 'TWD') {
        twdAmount = numValue * (defaultExchangeRates[detectedCurrency] || 1);
      }

      // 4. 計算目標幣別金額
      let targetAmount = numValue;
      if (detectedCurrency !== targetCurrency) {
        if (targetCurrency === 'TWD') {
          targetAmount = twdAmount;
        } else if (targetCurrency === 'JPY') {
          const rateToTwd = tripData.customRate || defaultExchangeRates.JPY;
          targetAmount = rateToTwd > 0 ? twdAmount / rateToTwd : twdAmount;
        } else {
          const rateToTwd = defaultExchangeRates[targetCurrency] || 1;
          targetAmount = rateToTwd > 0 ? twdAmount / rateToTwd : twdAmount;
        }
      }

      return { targetAmount, twdAmount };
    }

    // 主渲染流程
    function renderApp() {
      renderDayTabs();
      renderHeaderDateInfo();
      renderItineraryRows();
      calculateTotals();
      saveData();
    }

    // 渲染日期資訊
    function renderHeaderDateInfo() {
      const currentDay = tripData.days[tripData.activeDayIndex];
      if (!currentDay) return;

      document.getElementById('currentDayTitle').innerText = currentDay.name || '天數';
      
      const dateDisplay = document.getElementById('currentDayDateDisplay');
      const datePicker = document.getElementById('dayDatePicker');
      
      if (currentDay.date) {
        dateDisplay.innerText = currentDay.date;
        datePicker.value = currentDay.date;
      } else {
        dateDisplay.innerText = "未設定日期";
        datePicker.value = "";
      }
    }

    // 1. 渲染天數頁籤 (Day Navigation)
    function renderDayTabs() {
      const container = document.getElementById('dayTabsContainer');
      container.innerHTML = '';

      tripData.days.forEach((day, index) => {
        const isActive = index === tripData.activeDayIndex;
        
        const tabBtn = document.createElement('div');
        tabBtn.className = `group relative flex items-center gap-1.5 px-4 py-2 rounded-full cursor-pointer transition select-none font-medium text-sm ${

            : 'bg-white text-slate-600 hover:bg-slate-200/70 border border-slate-200'

        tabBtn.onclick = () => {
          tripData.activeDayIndex = index;
          renderApp();
        };

        const dateSub = day.date ? `<span class="text-[10px] opacity-80 font-normal">(${day.date.slice(5)})</span>` : '';

        tabBtn.innerHTML = `
          <span>${day.name}</span>
          ${dateSub}
          ${tripData.days.length > 1 ? `

              <i class="fa-solid fa-xmark"></i>
            </button>

        `;

        container.appendChild(tabBtn);
      });

      // 新增天數 (+) 按鈕
      const addDayBtn = document.createElement('button');
      addDayBtn.className = "w-9 h-9 rounded-full bg-white hover:bg-indigo-50 border border-slate-300 flex items-center justify-center text-slate-500 hover:text-indigo-600 transition shadow-sm cursor-pointer shrink-0";
      addDayBtn.title = "新增下一天";
      addDayBtn.onclick = addNewDay;
      addDayBtn.innerHTML = `<i class="fa-solid fa-plus"></i>`;
      container.appendChild(addDayBtn);
    }

    // 2. 渲染當前 Day 的行程列 (Rows & Cards)
    function renderItineraryRows() {
      const container = document.getElementById('itineraryRowsContainer');
      container.innerHTML = '';

      const currentDay = tripData.days[tripData.activeDayIndex];

          const card = document.createElement('div');

          const detailHtml = getCardDetailSummary(item);

          card.innerHTML = `
            <div class="flex flex-col gap-1 overflow-hidden mr-2 flex-1 pointer-events-none">

              ${itemUrl ? `
                <a href="${escapeHtml(itemUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs px-2.5 py-1 rounded-lg shadow-sm transition transform hover:scale-105" title="開啟連結：${escapeHtml(itemUrl)}">

    // 產生卡片上的即時預覽資訊 (HTML)
    function getCardDetailSummary(item) {
      const lines = [];

      // A. 交通：時間區間、耗時、班次細節
      if (item.category === 'transport') {
        if (item.transportTime || item.transportDuration) {
          lines.push(`
            <div class="flex items-center gap-1.5 text-indigo-700 font-medium">
              <i class="fa-regular fa-clock text-[11px]"></i>
              <span>${escapeHtml(item.transportTime || '')}</span>
              ${item.transportDuration ? `<span class="bg-indigo-100/70 text-indigo-800 px-1.5 py-0.2 rounded text-[10px]">${escapeHtml(item.transportDuration)}</span>` : ''}
            </div>
          `);
        }
        if (item.transportDetails) {
          lines.push(`<div class="truncate text-slate-500"><i class="fa-solid fa-circle-info mr-1 text-[10px]"></i>${escapeHtml(item.transportDetails)}</div>`);
        }
      }

      // B. 住宿：總價、平台、訂金、早餐/停車
      else if (item.category === 'hotel') {
        const hotelMeta = [];
        if (item.hotelTotalPrice) hotelMeta.push(`總價: ${escapeHtml(item.hotelTotalPrice)}`);
        if (item.hotelBookingMethod) hotelMeta.push(`(${escapeHtml(item.hotelBookingMethod)})`);
        if (item.hotelDeposit) hotelMeta.push(`訂金: ${escapeHtml(item.hotelDeposit)}`);
        
        if (hotelMeta.length > 0) {
          lines.push(`<div class="font-medium text-emerald-800"><i class="fa-solid fa-receipt mr-1 text-[10px]"></i>${hotelMeta.join(' ')}</div>`);
        }

        const tags = [];
        if (item.hotelPaid) tags.push('<span class="text-emerald-600 font-semibold">✓ 訂金已付</span>');
        if (item.hotelBreakfast) tags.push('含早餐');
        if (item.hotelParking) tags.push('有停車場');
        if (tags.length > 0) {
          lines.push(`<div class="text-[11px] text-slate-500">${tags.join(' • ')}</div>`);
        }
      }
      // C. 景點：必去亮點、門票、星等
      else if (item.category === 'sightseeing') {
        if (item.spotHighlight) {
          lines.push(`<div class="font-medium text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200/60 inline-block"><i class="fa-solid fa-star mr-1 text-amber-500"></i>亮點: ${escapeHtml(item.spotHighlight)}</div>`);
        }
        const spotMeta = [];
        if (item.spotPrice) spotMeta.push(`門票: ${escapeHtml(item.spotPrice)}`);
        if (item.rating) spotMeta.push(`<span class="text-amber-500 font-bold">${'★'.repeat(item.rating)}</span>`);
        if (item.spotNotes) spotMeta.push(escapeHtml(item.spotNotes));
        if (spotMeta.length > 0) {
          lines.push(`<div class="text-slate-500">${spotMeta.join(' | ')}</div>`);
        }
      }

      // D. 用餐：推薦菜單、價格、星等、備註
      else if (item.category === 'dining') {
        if (item.diningMenu) {
          lines.push(`<div class="font-medium text-rose-700"><i class="fa-solid fa-bowl-food mr-1 text-rose-500"></i>推薦: ${escapeHtml(item.diningMenu)}</div>`);
        }
        const diningMeta = [];
        if (item.diningPrice) diningMeta.push(escapeHtml(item.diningPrice));
        if (item.rating) diningMeta.push(`<span class="text-amber-500 font-bold">${'★'.repeat(item.rating)}</span>`);
        if (item.diningNotes) diningMeta.push(escapeHtml(item.diningNotes));
        if (diningMeta.length > 0) {
          lines.push(`<div class="text-slate-500">${diningMeta.join(' • ')}</div>`);
        }
      }

      // E. 購買：地點、金額、購買項目
      else if (item.category === 'shopping') {
        if (item.shoppingLocation || item.shoppingAmount) {
          lines.push(`<div class="font-medium text-amber-800"><i class="fa-solid fa-store mr-1 text-amber-600"></i>${escapeHtml(item.shoppingLocation || '')} ${item.shoppingAmount ? `<span class="bg-amber-100/80 text-amber-900 px-1.5 py-0.2 rounded text-[10px] ml-1">${escapeHtml(item.shoppingAmount)}</span>` : ''}</div>`);
        }
        if (item.shoppingItems) {
          lines.push(`<div class="text-slate-500 truncate"><i class="fa-solid fa-basket-shopping mr-1 text-[10px]"></i>${escapeHtml(item.shoppingItems)}</div>`);
        }
      }

      // F. 自訂
      else if (item.category === 'other') {
        if (item.otherNotes) {
          lines.push(`<div class="text-slate-500 truncate">${escapeHtml(item.otherNotes)}</div>`);
        }
      }

      return lines.join('');
    }

    // 取得項目中設定的網址連結
    function getItemUrl(item) {
      if (item.category === 'hotel' && item.hotelUrl) return item.hotelUrl;
      if (item.category === 'sightseeing' && item.spotUrl) return item.spotUrl;
      if (item.category === 'dining' && item.diningUrl) return item.diningUrl;
      return null;
    }

    // 取得類別對應 FontAwesome 圖示
    function getCategoryIcon(cat, transportType) {
      if (cat === 'transport') {
        switch(transportType) {
          case 'plane': return '<i class="fa-solid fa-plane"></i>';
          case 'bus': return '<i class="fa-solid fa-bus"></i>';
          case 'car': return '<i class="fa-solid fa-car"></i>';
          case 'scooter': return '<i class="fa-solid fa-motorcycle"></i>';
          case 'taxi': return '<i class="fa-solid fa-taxi"></i>';
          case 'walk': return '<i class="fa-solid fa-person-walking"></i>';
          case 'bike': return '<i class="fa-solid fa-bicycle"></i>';
          default: return '<i class="fa-solid fa-train"></i>';
        }
      }
      if (cat === 'hotel') return '<i class="fa-solid fa-bed"></i>';
      if (cat === 'sightseeing') return '<i class="fa-solid fa-camera-retro"></i>';
      if (cat === 'dining') return '<i class="fa-solid fa-utensils"></i>';
      if (cat === 'shopping') return '<i class="fa-solid fa-bag-shopping"></i>';
      return '<i class="fa-solid fa-location-dot"></i>';
    }

    // 快速變更顏色
    function quickChangeColor(rIdx, iIdx, color) {
      tripData.days[tripData.activeDayIndex].rows[rIdx][iIdx].color = color;
      renderApp();
    }

    // 新增天數 (Day)
    function addNewDay() {
      const nextDayNum = tripData.days.length + 1;
      const dayNames = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二", "十三", "十四", "十五"];
      const nameStr = nextDayNum <= dayNames.length ? `第${dayNames[nextDayNum - 1]}天` : `第 ${nextDayNum} 天`;
      
      tripData.days.push({
        name: nameStr,
        date: "",
        rows: [
          [
            { id: Date.now().toString(), title: '新行程項目', color: categoryDefaultColors.other, category: 'other' }
          ]
        ]
      });
      tripData.activeDayIndex = tripData.days.length - 1;
      renderApp();
    }

    // 刪除天數 (Day)
    function deleteDay(event, index) {
      event.stopPropagation();
      if (tripData.days.length <= 1) return;

      tripData.days.splice(index, 1);
      if (tripData.activeDayIndex >= tripData.days.length) {
        tripData.activeDayIndex = tripData.days.length - 1;
      }
      renderApp();
    }

    // 在同列加入項目 (+)
    function addItemToRow(rIdx) {
      tripData.days[tripData.activeDayIndex].rows[rIdx].push({
        id: Date.now().toString(),
        title: '備選 / 同步項目',
        color: categoryDefaultColors.other,
        category: 'other'
      });
      renderApp();
    }

    // 在指定索引位置插入同行項目
    function insertItemAtRow(rIdx, targetIndex) {
      tripData.days[tripData.activeDayIndex].rows[rIdx].splice(targetIndex, 0, {
        id: Date.now().toString(),
        title: '新增插入項目',
        color: categoryDefaultColors.other,
        category: 'other'
      });
      renderApp();
    }

    // 在指定索引位置插入全新一整列行程 (Row)
    function insertRowAt(rIdx) {
      tripData.days[tripData.activeDayIndex].rows.splice(rIdx, 0, [
        { id: Date.now().toString(), title: '新行程項目', color: categoryDefaultColors.other, category: 'other' }
      ]);
      renderApp();
    }

    // 在下方新增一整列行程
    function addNewRow() {
      const currentDay = tripData.days[tripData.activeDayIndex];
      if (!currentDay) return;
      currentDay.rows.push([
        { id: Date.now().toString(), title: '新行程項目', color: categoryDefaultColors.other, category: 'other' }
      ]);
      renderApp();
    }

    // 在下方新增一整列行程
    function addNewRow() {
      const currentDay = tripData.days[tripData.activeDayIndex];
      if (!currentDay) return;
      currentDay.rows.push([
        { id: Date.now().toString(), title: '新行程項目', color: '#ffffff', category: 'other' }
      ]);
      renderApp();
    }

    // 刪除標籤項目
    function deleteItem(rIdx, iIdx) {
      const currentDay = tripData.days[tripData.activeDayIndex];
      currentDay.rows[rIdx].splice(iIdx, 1);

      // 如果整列空了，刪除該列
      if (currentDay.rows[rIdx].length === 0) {
        currentDay.rows.splice(rIdx, 1);
      }
      renderApp();
    }

    // --- Modal 詳細編輯邏輯 ---

    function openModal(rIdx, iIdx) {
      const item = tripData.days[tripData.activeDayIndex].rows[rIdx][iIdx];
      editingContext = {
        dayIndex: tripData.activeDayIndex,
        rowIndex: rIdx,
        itemIndex: iIdx,
        tempImageBase64: item.imageBase64 || null,
        selectedCategory: item.category || 'other'
      };

      // 填入通用品項
      document.getElementById('modalTitle').value = item.title || '';
      document.getElementById('modalColor').value = item.color || '#ffffff';

      // 填入類別特定品項
      selectCategory(editingContext.selectedCategory);

      // Transport
      document.getElementById('modalTransportType').value = item.transportType || 'plane';
      document.getElementById('modalTransportTime').value = item.transportTime || '';
      document.getElementById('modalTransportDuration').value = item.transportDuration || '';
      document.getElementById('modalTransportDetails').value = item.transportDetails || '';

      // Hotel
      document.getElementById('modalHotelName').value = item.hotelName || '';
      document.getElementById('modalHotelTotalPrice').value = item.hotelTotalPrice || '';
      document.getElementById('modalHotelBookingMethod').value = item.hotelBookingMethod || '';
      document.getElementById('modalHotelDeposit').value = item.hotelDeposit || '';
      document.getElementById('modalHotelUrl').value = item.hotelUrl || '';
      document.getElementById('modalHotelAddress').value = item.hotelAddress || '';
      document.getElementById('modalHotelAccess').value = item.hotelAccess || '';
      document.getElementById('modalHotelNotes').value = item.hotelNotes || '';
      document.getElementById('modalHotelBreakfast').checked = !!item.hotelBreakfast;
      document.getElementById('modalHotelParking').checked = !!item.hotelParking;
      document.getElementById('modalHotelPaid').checked = !!item.hotelPaid;

      // Sightseeing
      document.getElementById('modalSpotHighlight').value = item.spotHighlight || '';
      document.getElementById('modalSpotPrice').value = item.spotPrice || '';
      document.getElementById('modalSpotUrl').value = item.spotUrl || '';
      document.getElementById('modalSpotNotes').value = item.spotNotes || '';

      // Dining
      document.getElementById('modalDiningMenu').value = item.diningMenu || '';
      document.getElementById('modalDiningPrice').value = item.diningPrice || '';
      document.getElementById('modalDiningUrl').value = item.diningUrl || '';
      document.getElementById('modalDiningNotes').value = item.diningNotes || '';

      // Shopping
      document.getElementById('modalShoppingLocation').value = item.shoppingLocation || '';
      document.getElementById('modalShoppingAmount').value = item.shoppingAmount || '';
      document.getElementById('modalShoppingItems').value = item.shoppingItems || '';

      // 設定星等
      setRating(item.rating || 0);

      // Other
      document.getElementById('modalOtherNotes').value = item.otherNotes || '';

      // 圖片預覽處理
      updateImagePreview();

      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    // 分類選擇切換
    function selectCategory(cat, isUserClick = false) {
      editingContext.selectedCategory = cat;

      // 如果是使用者在 Modal 內點擊切換類別，自動套用該類別預設顏色
      if (isUserClick && categoryDefaultColors[cat]) {
        document.getElementById('modalColor').value = categoryDefaultColors[cat];
      }

      // 更新按鈕高亮
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
      });
      const activeBtn = document.getElementById(`catBtn-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
      }

      // 切換欄位區塊顯示
      document.querySelectorAll('.cat-fields').forEach(el => el.classList.add('hidden'));
      const targetFields = document.getElementById(`fields-${cat}`);
      if (targetFields) {
        targetFields.classList.remove('hidden');
      }
    }

    // 上傳圖片 (Base64)
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          editingContext.tempImageBase64 = evt.target.result;
          updateImagePreview();
        };
        reader.readAsDataURL(file);
      }
    }

    function removeImage() {
      editingContext.tempImageBase64 = null;
      document.getElementById('modalImageInput').value = '';
      updateImagePreview();
    }

    function updateImagePreview() {
      const previewContainer = document.getElementById('imagePreviewContainer');
      const previewImg = document.getElementById('imagePreview');
      const removeBtn = document.getElementById('removeImgBtn');

      if (editingContext.tempImageBase64) {
        previewImg.src = editingContext.tempImageBase64;
        previewContainer.classList.remove('hidden');
        removeBtn.classList.remove('hidden');
      } else {
        previewImg.src = '';
        previewContainer.classList.add('hidden');
        removeBtn.classList.add('hidden');
      }
    }

    // 設定星等選擇器 UI
    function setRating(val) {
      editingContext.currentRating = val;
      renderStarRatingUI('spotStarRatingContainer', val);
      renderStarRatingUI('diningStarRatingContainer', val);
    }

    function renderStarRatingUI(containerId, activeRating) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';

      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('button');
        star.type = 'button';
        star.className = `text-lg transition transform hover:scale-110 cursor-pointer ${
          i <= activeRating ? 'text-amber-400' : 'text-slate-300 hover:text-amber-200'
        }`;
        star.innerHTML = '<i class="fa-solid fa-star"></i>';
        star.onclick = () => setRating(i === editingContext.currentRating ? 0 : i);
        container.appendChild(star);
      }
    }

    // 儲存 Modal 編輯內容
    function saveModalData() {
      const { dayIndex, rowIndex, itemIndex } = editingContext;
      const item = tripData.days[dayIndex].rows[rowIndex][itemIndex];

      item.title = document.getElementById('modalTitle').value;
      item.color = document.getElementById('modalColor').value;
      item.category = editingContext.selectedCategory;
      item.imageBase64 = editingContext.tempImageBase64;
      item.rating = editingContext.currentRating;

      // Transport
      item.transportType = document.getElementById('modalTransportType').value;
      item.transportTime = document.getElementById('modalTransportTime').value;
      item.transportDuration = document.getElementById('modalTransportDuration').value;
      item.transportDetails = document.getElementById('modalTransportDetails').value;

      // Hotel
      item.hotelName = document.getElementById('modalHotelName').value;
      item.hotelTotalPrice = document.getElementById('modalHotelTotalPrice').value;
      item.hotelBookingMethod = document.getElementById('modalHotelBookingMethod').value;
      item.hotelDeposit = document.getElementById('modalHotelDeposit').value;
      item.hotelUrl = document.getElementById('modalHotelUrl').value;
      item.hotelAddress = document.getElementById('modalHotelAddress').value;
      item.hotelAccess = document.getElementById('modalHotelAccess').value;
      item.hotelNotes = document.getElementById('modalHotelNotes').value;
      item.hotelBreakfast = document.getElementById('modalHotelBreakfast').checked;
      item.hotelParking = document.getElementById('modalHotelParking').checked;
      item.hotelPaid = document.getElementById('modalHotelPaid').checked;

      // Sightseeing
      item.spotHighlight = document.getElementById('modalSpotHighlight').value;
      item.spotPrice = document.getElementById('modalSpotPrice').value;
      item.spotUrl = document.getElementById('modalSpotUrl').value;
      item.spotNotes = document.getElementById('modalSpotNotes').value;

      // Dining
      item.diningMenu = document.getElementById('modalDiningMenu').value;
      item.diningPrice = document.getElementById('modalDiningPrice').value;
      item.diningUrl = document.getElementById('modalDiningUrl').value;
      item.diningNotes = document.getElementById('modalDiningNotes').value;

      // Shopping
      item.shoppingLocation = document.getElementById('modalShoppingLocation').value;
      item.shoppingAmount = document.getElementById('modalShoppingAmount').value;
      item.shoppingItems = document.getElementById('modalShoppingItems').value;

      // Other
      item.otherNotes = document.getElementById('modalOtherNotes').value;

      closeModal();
      renderApp();
    }

    // XSS 防護字串轉義
    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#039;");
    }

    // 3. 匯出獨立可執行的 HTML 網頁檔
    function exportStandaloneHTML() {
      const dataJson = JSON.stringify(tripData);
      
      let htmlContent = document.documentElement.outerHTML;

      // 將腳本中初始化 tripData 覆蓋為當前最新資料
      htmlContent = htmlContent.replace(
        /let tripData = \{[\s\S]*?\};/, 
        `let tripData = ${dataJson};`
      );

      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const filename = `${tripData.title || '行程規劃'}.html`;

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }
  </script>
